name: CI Automation Tests

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  # ЗАВДАННЯ 1: Запуск Cypress у Docker
  cypress-run:
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-20.9.0-chrome-118.0.5993.88-1-ff-118.0.2-edge-118.0.2088.46-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npx cypress run --browser firefox
        env:
          CYPRESS_guestUser: 'guest'
          CYPRESS_guestPassword: 'welcome2qauto'

  # ЗАВДАННЯ 2: Запуск Playwright у Docker
  playwright-run:
    runs-on: ubuntu-latest
    container:
      image: ://microsoft.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test
